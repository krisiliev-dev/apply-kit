<!-- Synthetic Greenhouse new job board application (job-boards.greenhouse.io) whose CV box accepts
     only a dropped file (the hidden input ignores `change`), and whose cover letter is a text box
     only. Modelled on docs/research/implementation/portals.md. Made-up company and job; no real
     person's data. The test setup simulates the drop zone. -->
<main class="main">
  <div class="job__header"><h1 class="section-header">Security Engineer</h1><div class="job__location">Sofia</div></div>
  <div class="application--container">
    <form id="application-form" class="application--form">
      <div class="application--questions">
        <div class="text-input-wrapper"><label id="first_name-label" for="first_name" class="label">First Name<span aria-hidden="true">*</span></label><input id="first_name" class="input" type="text" maxlength="255" aria-required="true" autocomplete="given-name"></div>
        <div class="text-input-wrapper"><label id="email-label" for="email" class="label">Email<span aria-hidden="true">*</span></label><input id="email" class="input" type="email" maxlength="255" aria-required="true" autocomplete="email"></div>
        <div class="file-upload drop-zone"><div id="upload-label-resume" class="label upload-label">Resume/CV<span aria-hidden="true">*</span></div><p class="file-upload__hint">Drop your file here</p><span class="filename"></span><input id="resume" type="file" class="visually-hidden" aria-labelledby="upload-label-resume" aria-required="true" accept=".pdf,.doc,.docx,.txt,.rtf"></div>
        <div class="text-input-wrapper"><label id="cover_letter_text-label" for="cover_letter_text" class="label">Cover Letter</label><textarea id="cover_letter_text" class="input" maxlength="10000"></textarea></div>
      </div>
      <div class="application--submit"><button type="submit" class="btn btn--rounded">Submit application</button></div>
    </form>
  </div>
</main>
