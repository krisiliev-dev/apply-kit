<!-- Synthetic Workday application page (myworkdayjobs.com): step 1, My Information. Modelled on
     docs/research/implementation/portals.md (data-automation-id names as Workday uses them). Made-up
     company (Kestrel Payments) and job; no real person's data. The test setup (fixtures/workday.ts)
     simulates Workday's widgets: list buttons, typeaheads with delayed suggestions, Add and Delete,
     and its CV reading. Every navigation button notes a press, which fails the test. -->

    <h2 data-automation-id="pageHeaderTitle">My Information</h2>

  </main>
  <div data-automation-id="pageFooter">
    <button type="button" data-automation-id="pageFooterBackButton">Back</button>
    <button type="button" data-automation-id="pageFooterNextButton">Save and Continue</button>
