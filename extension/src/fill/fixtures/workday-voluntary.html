<!-- Synthetic Workday application page (myworkdayjobs.com): step 4, Voluntary Disclosures. Modelled on
     docs/research/implementation/portals.md (data-automation-id names as Workday uses them). Made-up
     company (Kestrel Payments) and job; no real person's data. The test setup (fixtures/workday.ts)
     simulates Workday's widgets: list buttons, typeaheads with delayed suggestions, Add and Delete,
     and its CV reading. Every navigation button notes a press, which fails the test. -->
<div data-automation-id="applyFlowPage">
  <header><span data-automation-id="headerCompanyName">Kestrel Payments</span><h1 data-automation-id="jobPostingHeader">Security Engineer</h1></header>
  <main>
    <div data-automation-id="progressBar"><ol aria-label="Application progress">
      <li data-automation-id="progressBarCompletedStep"><label class="sr-only">completed step 1 of 6</label><div>My Information</div></li>
      <li data-automation-id="progressBarCompletedStep"><label class="sr-only">completed step 2 of 6</label><div>My Experience</div></li>
      <li data-automation-id="progressBarCompletedStep"><label class="sr-only">completed step 3 of 6</label><div>Application Questions</div></li>
      <li data-automation-id="progressBarActiveStep"><label class="sr-only">current step 4 of 6</label><div>Voluntary Disclosures</div></li>
      <li data-automation-id="progressBarInactiveStep"><label class="sr-only">step 5 of 6</label><div>Self Identify</div></li>
      <li data-automation-id="progressBarInactiveStep"><label class="sr-only">step 6 of 6</label><div>Review</div></li>
    </ol></div>
    <h2 data-automation-id="pageHeaderTitle">Voluntary Disclosures</h2>
    <div data-automation-id="voluntaryDisclosuresPage">
    <p>Kestrel Payments invites you to answer the questions below. Answering is voluntary.</p>
      <div data-automation-id="formField-personalInfoPerson--gender"><label for="personalInfoPerson--gender" id="personalInfoPerson--gender-label">Gender</label><button type="button" id="personalInfoPerson--gender" aria-haspopup="listbox" aria-labelledby="personalInfoPerson--gender-label" value="" data-fixture-options="Select One|Female|Male|Non-binary|I do not wish to answer">Select One</button></div>
      <div data-automation-id="formField-personalInfoPerson--ethnicity"><label for="personalInfoPerson--ethnicity" id="personalInfoPerson--ethnicity-label">Please select the ethnicity which most accurately describes how you identify yourself</label><button type="button" id="personalInfoPerson--ethnicity" aria-haspopup="listbox" aria-labelledby="personalInfoPerson--ethnicity-label" value="" data-fixture-options="Select One|Hispanic or Latino|White|Two or More Races|I do not wish to answer">Select One</button></div>
      <div data-automation-id="formField-personalInfoPerson--veteranStatus"><label for="personalInfoPerson--veteranStatus" id="personalInfoPerson--veteranStatus-label">Veteran Status</label><button type="button" id="personalInfoPerson--veteranStatus" aria-haspopup="listbox" aria-labelledby="personalInfoPerson--veteranStatus-label" value="" data-fixture-options="Select One|I am not a protected veteran|I identify as one or more of the classifications of protected veteran|I do not wish to self-identify">Select One</button></div>
      <div data-automation-id="formField-termsAndConditions--acceptTermsAndAgreements"><input type="checkbox" id="termsAndConditions--acceptTermsAndAgreements" aria-required="true"><label for="termsAndConditions--acceptTermsAndAgreements">I consent to the terms and conditions and the privacy notice</label></div>
    </div>
  </main>
  <div data-automation-id="pageFooter">
    <button type="button" data-automation-id="pageFooterBackButton">Back</button>
    <button type="button" data-automation-id="pageFooterNextButton">Save and Continue</button>
  </div>
</div>
