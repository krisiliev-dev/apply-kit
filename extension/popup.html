<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin: 0 0 10px;
        color: #555;
      }
      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #777;
        margin: 10px 0 3px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font: inherit;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        font: inherit;
        padding: 7px 10px;
        border: 1px solid #1f6feb;
        background: #1f6feb;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }
      button.secondary {
        background: #fff;
        color: #1f6feb;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        color: #444;
        min-height: 16px;
      }
      .muted {
        color: #888;
        font-size: 11px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>CV-maker Capture</h1>

    <label for="appUrl">App URL</label>
    <input type="text" id="appUrl" placeholder="http://localhost:3000" />

    <div class="row">
      <input type="checkbox" id="autoCapture" />
      <label for="autoCapture" style="margin: 0; text-transform: none; letter-spacing: 0; color: #333; font-size: 12px;">
        Auto-capture job pages as I browse
      </label>
    </div>

    <div class="row">
      <button id="captureNow">Capture this page</button>
    </div>

    <div class="status" id="status"></div>
    <div class="muted">
      Reads only the page you're viewing, in your own session. Captures land in
      your CV-maker discovery pool.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
